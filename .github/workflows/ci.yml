name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    name: Motor contable (Linux · swift test)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Tests del motor
        run: swift test

  copia:
    name: La app lleva el motor al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar Sources/CuadernoCore con CuadernoApp.swiftpm/Core
        run: python3 scripts/sincronizar_core.py --comprobar

  app:
    name: App de iPad (macOS · xcodebuild)
    runs-on: macos-15
    needs: copia
    steps:
      - uses: actions/checkout@v4
      - name: Versión de Xcode
        run: xcodebuild -version
      - name: Esquemas del paquete
        working-directory: CuadernoApp.swiftpm
        run: xcodebuild -list
      - name: Compilar para el simulador de iPad
        working-directory: CuadernoApp.swiftpm
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "Cuaderno CFI" \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/compilacion.log"
      # Si no compila, los errores salen como una anotación del job. Las anotaciones se leen por la
      # API pública de GitHub sin iniciar sesión, así que se pueden arreglar sin abrir el registro.
      - name: Errores de compilación
        if: failure()
        run: |
          python3 - "$RUNNER_TEMP/compilacion.log" <<'PY'
          import re, sys
          vistos = []
          for linea in open(sys.argv[1], encoding="utf-8", errors="replace"):
              m = re.search(r"([^/\s]+\.swift:\d+:\d+: error: .*)", linea)
              if m and m.group(1).strip() not in vistos:
                  vistos.append(m.group(1).strip())
          if not vistos:
              vistos = [l.strip() for l in open(sys.argv[1], encoding="utf-8", errors="replace") if "error" in l][-20:]
          texto = "\n".join(vistos[:60]) or "Sin errores en el registro."
          texto = texto.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=Errores de compilación::{texto}")
          PY

  # La versión para el iPad: si todo está en verde, se publica el zip de la app en un enlace fijo
  # (.../releases/download/ultima/CuadernoApp.zip) que descarga el Atajo del iPad (ADR-009).
  publicar:
    name: Publicar la versión para el iPad
    runs-on: ubuntu-latest
    needs: [motor, app]
    if: github.ref_name == 'paso-0/prototipo'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar CuadernoApp.swiftpm
        run: zip -qr CuadernoApp.zip CuadernoApp.swiftpm
      - name: Sustituir la publicación «ultima»
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima CuadernoApp.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Última versión para el iPad" \
            --notes "Rama ${GITHUB_REF_NAME} · commit ${GITHUB_SHA::7}. La descarga el Atajo del iPad."
